if(d.v==='context')return `<div class="agent-card">${codeLines(d.code)}<div class="context-target"><b>مخاطب پروژه</b></div></div>`;

const viewport=document.getElementById('viewport'),scenes=[...document.querySelectorAll('.scene')],mapStage=mapLayer.querySelector('.map-stage'),mapShell=mapLayer.querySelector('.map-shell'),mapCards=[...mapLayer.querySelectorAll('.map-card')],count=document.getElementById('count'),bar=document.getElementById('bar'),path=document.getElementById('path'),label=document.getElementById('overviewLabel'),notesPanel=document.getElementById('notesPanel'),notesText=document.getElementById('notesText');let current=0,busy=false,overview=false,touchX=0;const sleep=ms=>new Promise(r=>setTimeout(r,ms)),fa=n=>new Intl.NumberFormat('fa-IR',{minimumIntegerDigits:2,useGrouping:false}).format(n),reduced=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
